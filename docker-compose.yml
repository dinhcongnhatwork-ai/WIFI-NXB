services:
  backend:
    image: ${APP_IMAGE:-wifimarketing:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wifi-marketing-backend
    restart: always
    network_mode: host
    env_file:
      - .env
    environment:
      APP_SERVER_MODE: backend
      PORT: 3001
      NODE_TLS_REJECT_UNAUTHORIZED: "1"
    command: npm run start:backend
    depends_on:
      - postgres
      - redis
      - minio

  frontend:
    image: ${APP_IMAGE:-wifimarketing:local}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wifi-marketing-frontend
    restart: always
    network_mode: host
    env_file:
      - .env
    environment:
      APP_SERVER_MODE: frontend
      PORT: 3000
      BACKEND_URL: http://127.0.0.1:3001
      NODE_TLS_REJECT_UNAUTHORIZED: "1"
    command: npm run start:frontend
    depends_on:
      - backend
      - minio

  hotspot-entry:
    image: node:20-bullseye-slim
    container_name: wifi-marketing-hotspot-entry
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      PORTAL_PUBLIC_URL: https://solutionai.com.vn
      PORTAL_ENTRY_HOST: 192.168.1.253
      PORTAL_ENTRY_PORT: '80'
    volumes:
      - ./deploy/hotspot-entry.mjs:/app/hotspot-entry.mjs:ro
    command: node /app/hotspot-entry.mjs

  postgres:
    image: postgres:16-alpine
    container_name: wifi-marketing-db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wifimarketing}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: wifi-marketing-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    container_name: wifi-marketing-minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  redisdata:
  miniodata:
