@version: 4.8
@include "scl.conf"
options { chain_hostnames(no); keep_hostname(yes); use_dns(no); stats(level(0)); flush_lines(100); log_fifo_size(10000); };
source s_network {
  network(ip("0.0.0.0") port(5514) transport("udp") flags(store-raw-message));
  network(ip("0.0.0.0") port(5514) transport("tcp") flags(store-raw-message));
};
# Replace these private-network examples with explicit management device IPs/CIDRs before LAN binding.
# Firewall the host port as well. No public listener is published by default.
filter f_management { netmask("127.0.0.0/8") or netmask("192.168.1.0/24") or netmask("172.16.0.0/12"); };
rewrite r_secrets {
  subst("(?i)\\b(Bearer|Basic)\\s+\\S+", "$1 [REDACTED]", value("MESSAGE") flags(global));
  subst("(?i)(password|passwd|(?:x[_-])?passphrase|secret|token|authorization|cookie|api[-_]?key|credential|wpa[-_]?psk|private[-_]?key|preshared[-_]?key|community)[\"']?(?:\\s*[=:]\\s*|\\s+)(?:\"[^\"\\r\\n]*\"|'[^'\\r\\n]*'|[^\\s,;}]+)", "$1=[REDACTED]", value("MESSAGE") flags(global));
  subst("(https?://)[^\\s/@]+:[^\\s/@]+@", "$1[REDACTED]@", value("MESSAGE") flags(global));
};

destination d_network {
  file("/var/log/network/devices.ndjson"
    template("$(format-json timestamp=${ISODATE} host=${HOST} sender=${SOURCEIP} severity=${LEVEL} facility=${FACILITY} message=${MESSAGE})\n")
    create_dirs(yes) perm(0640));
};
log { source(s_network); filter(f_management); rewrite(r_secrets); destination(d_network); flags(flow-control); };
