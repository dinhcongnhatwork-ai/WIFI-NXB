# Run on the host against the mounted network-syslog volume path.
# Keep uncompressed rotated inodes until ingestion has caught up; never use copytruncate.
/var/log/network/devices.ndjson {
  daily
  rotate 30
  missingok
  notifempty
  nocompress
  create 0640 root root
  sharedscripts
  postrotate
    docker compose -f docker-compose.yml -f compose.monitoring.yml --env-file .env --env-file monitoring/images.lock.env exec -T syslog-ng syslog-ng-ctl reopen
  endscript
}
